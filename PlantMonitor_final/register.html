
<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registo | Plant Monitor</title>

    <!-- Folha de estilos -->

    <link rel="stylesheet" href="css/style.css">

    <!-- Biblioteca de ícones -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Container principal -->

    <div class="register-container">

        <!-- Caixa do formulário -->

        <div class="register-box">

            <!-- Nome da aplicação -->

            <div class="logo">

                <i class="fa-solid fa-seedling"></i>

                <h1>Plant Monitor</h1>

                <p>

                    Cria uma conta para começares a monitorizar as tuas plantas.

                </p>

            </div>

            <!-- Formulário de registo -->

            <form id="registerForm" action="php/register.php" method="POST">

                <h2>Criar Conta</h2>

                <!-- Nome -->

                <div class="input-group">

                    <label for="name">

                        <i class="fa-solid fa-user"></i>

                        Nome

                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Introduz o teu nome"
                        required>

                </div>

                <!-- Username -->

                <div class="input-group">

                    <label for="username">

                        <i class="fa-solid fa-at"></i>

                        Nome de Utilizador

                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Escolhe um nome de utilizador"
                        required>

                </div>

                <!-- Email -->

                <div class="input-group">

                    <label for="email">

                        <i class="fa-solid fa-envelope"></i>

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Introduz o teu email"
                        required>

                </div>

                <!-- Palavra-passe -->

                <div class="input-group">

                    <label for="password">

                        <i class="fa-solid fa-lock"></i>

                        Palavra-passe

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Cria uma palavra-passe"
                        required>

                </div>

                <!-- Confirmar palavra-passe -->

                <div class="input-group">

                    <label for="confirmPassword">

                        <i class="fa-solid fa-lock"></i>

                        Confirmar Palavra-passe

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirma a palavra-passe"
                        required>

                </div>

                <!-- Mostrar password -->

                <div class="options">

                    <label>

                        <input type="checkbox" id="showPasswords">

                        Mostrar palavras-passe

                    </label>

                </div>

                <!-- Aceitar termos -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        Li e aceito os Termos e Condições.

                    </label>

                </div>

                <!-- Mensagem para erros ou sucesso -->

                <p id="registerMessage"></p>

                <!-- Botão -->

                <button type="submit" id="registerBtn">

                    <i class="fa-solid fa-user-plus"></i>

                    Criar Conta

                </button>

            </form>

            <!-- Ligação para o login -->

            <div class="extra-links">

                <p>

                    Já tens conta?

                    <a href="login.html">

                        Iniciar Sessão

                    </a>

                </p>

            </div>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="js/register.js"></script>

</body>

</html>
